<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Professional Health Monitoring System</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --blue: #58a6ff;
            --red: #ff7b72;
            --green: #3fb950;
            --border: #30363d;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--card);
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .patient-info input {
            background: transparent;
            border: 1px dashed #444;
            color: var(--blue);
            padding: 5px;
            font-size: 1rem;
            margin: 2px;
            border-radius: 4px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }

        .vitals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            border-top: 4px solid var(--blue);
        }

        .graph-panel {
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            height: 220px !important;
            min-height: 220px !important;
            border: 1px solid var(--border);
            position: relative;
        }

        #status-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 8px solid var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px auto;
            font-weight: bold;
        }

        .alert-box {
            background: #010409;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border);
            font-size: 0.8rem;
        }

        .alert-entry {
            padding: 8px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 4px;
            border-left: 4px solid transparent;
        }

        .critical {
            color: var(--red);
            border-left-color: var(--red);
            background: rgba(255, 123, 114, 0.05);
        }

        #print-data-section {
            display: none;
            margin-top: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: black;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body {
                background: white !important;
                color: black !important;
                padding: 0;
            }

            header, .stat-card, .graph-panel, .alert-box {
                background: white !important;
                border: 1px solid #ccc !important;
                color: black !important;
            }

            .main-layout {
                display: block !important;
            }

            .btn-print {
                display: none !important;
            }

            #print-data-section {
                display: block !important;
                page-break-before: always;
            }

            .graph-panel {
                height: 250px !important;
                margin-bottom: 40px !important;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="patient-info">
        <h1 style="margin:0; font-size: 1.3rem; color: var(--blue);">
            HEALTH MONITORING SYSTEM
        </h1>

        NAME:
        <input type="text" value="PATIENT_NAME" id="p-name">

        |

        ID:
        <input type="text" value="REG-2026-X" id="p-id">
    </div>

    <div id="clock" style="font-family: monospace; font-size: 1.2rem;">
        00:00:00
    </div>

    <button class="btn-print" onclick="window.print()" style="background: var(--blue); color:white; border:none; padding:12px 20px; border-radius:6px; cursor:pointer; font-weight:bold;">
        PRINT CLINICAL REPORT
    </button>
</header>

<div class="main-layout">

    <div class="content">

        <div class="vitals-grid">
            <div class="stat-card">
                <h3>TEMP (°C)</h3>
                <h2 id="v-temp">--</h2>
            </div>

            <div class="stat-card" style="border-color: var(--red);">
                <h3>HEART RATE</h3>
                <h2 id="v-bpm">--</h2>
            </div>

            <div class="stat-card" style="border-color: var(--green);">
                <h3>SPO2 (%)</h3>
                <h2 id="v-spo2">--</h2>
            </div>
        </div>

        <div class="graph-panel"><canvas id="chartT"></canvas></div>
        <div class="graph-panel"><canvas id="chartB"></canvas></div>
        <div class="graph-panel"><canvas id="chartS"></canvas></div>

    </div>

    <div class="sidebar">

        <div class="stat-card" style="text-align: center; border-top:none;">
            <h3>VITAL STATUS</h3>
            <div id="status-circle">STABLE</div>
            <p style="font-size: 0.7rem; color: #8b949e;">MONITORING LIVE...</p>
        </div>

        <br>

        <div class="stat-card" style="border-top:none;">
            <h3 style="color: var(--blue);">CLINICAL OBSERVATIONS</h3>
            <div class="alert-box" id="alert-log">System active...</div>
        </div>

    </div>
</div>

<div id="print-data-section">
    <h2>DETAILED CLINICAL LOG</h2>

    <table id="full-data-table">
        <thead>
            <tr>
                <th>Time</th>
                <th>Temp (°C)</th>
                <th>BPM</th>
                <th>SpO2 (%)</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>

setInterval(() => {
    document.getElementById('clock').innerText =
        new Date().toLocaleTimeString();
}, 1000);


function buildChart(canvasId, color, min, max) {
    const ctx = document.getElementById(canvasId).getContext('2d');

    return new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [{
                borderColor: color,
                data: [],
                borderWidth: 3,
                fill: true,
                backgroundColor: color + '15',
                tension: 0.4,
                pointRadius: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: {
                    min: min,
                    max: max,
                    grid: { color: '#222' },
                    ticks: { color: '#888' }
                }
            }
        }
    });
}


const charts = {
    T: buildChart('chartT', '#58a6ff', 34, 42),
    B: buildChart('chartB', '#ff7b72', 40, 160),
    S: buildChart('chartS', '#3fb950', 85, 100)
};


async function fetchData() {
    try {
        const res = await fetch('/get_data');
        const data = await res.json();

        if (data.history && data.history.length > 0) {

            const cur = data.history[0];

            document.getElementById('v-temp').innerText = cur.temp + "°C";
            document.getElementById('v-bpm').innerText = cur.bpm;
            document.getElementById('v-spo2').innerText = cur.spo2 + "%";

            const rev = [...data.history].reverse();
            const labels = rev.map(d => d.time);

            charts.T.data.labels = labels;
            charts.T.data.datasets[0].data = rev.map(d => d.temp);
            charts.T.update('none');

            charts.B.data.labels = labels;
            charts.B.data.datasets[0].data = rev.map(d => d.bpm);
            charts.B.update('none');

            charts.S.data.labels = labels;
            charts.S.data.datasets[0].data = rev.map(d => d.spo2);
            charts.S.update('none');

            document.getElementById('alert-log').innerHTML =
                data.alerts.map(a =>
                    `<div class="alert-entry ${a.type}">
                        <b>[${a.time}]</b> ${a.msg}
                    </div>`
                ).join('');

            document.querySelector("#full-data-table tbody").innerHTML =
                data.history.map(d =>
                    `<tr>
                        <td>${d.time}</td>
                        <td>${d.temp}</td>
                        <td>${d.bpm}</td>
                        <td>${d.spo2}</td>
                    </tr>`
                ).join('');
        }

    } catch (e) {
        console.error("Poll Error:", e);
    }
}

setInterval(fetchData, 2000);

</script>

</body>
</html>
